<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareLoc</title>
    <style>
        /* Grundlegendes Seitendesign */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Richtet Titel und Container untereinander aus */
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.5s ease;
        }

        /* Styling für die sichtbare Überschrift */
        .site-title {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
        }

        /* Container für die Buttons - Jetzt standardmäßig vertikal (column) */
        .button-container {
            display: flex;
            flex-direction: column; /* Ordnet die Buttons untereinander an */
            gap: 15px; /* Gleichmäßiger Abstand zwischen den Buttons */
            width: 100%;
            max-width: 400px; /* Begrenzt die maximale Breite, damit sie vertikal gut aussehen */
            padding: 20px;
            box-sizing: border-box;
        }

        /* Button-Styling */
        .custom-button {
            width: 100%; /* Nutzen die volle Breite des Containers */
            height: 55px; /* Feste, identische Höhe für alle Buttons */
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
		.container-img {
			display: block;     /* Ermöglicht die Nutzung von automatischen Rändern */
			width: 30%;         /* Nutzt die halbe Breite des Containers */
			height: auto !important; /* Verhindert jegliche Verzerrung */
			margin: 10px auto 0 auto; /* Zentriert das Bild horizontal (oben 10px, links/rechts auto) */
			border-radius: 6px;
			box-shadow: 0 2px 5px rgba(0,0,0,0.1);
		}
        /* Klick-Effekt */
        .custom-button:active {
            transform: scale(0.98);
        }

        /* Farben für die Buttons */
        .btn-link { background-color: #2ecc71; }
        .btn-link:hover { background-color: #27ae60; }

        .btn-alert { background-color: #34495e; }
        .btn-alert:hover { background-color: #2c3e50; }

        .btn-color { background-color: #e67e22; }
        .btn-color:hover { background-color: #d35400; }

        /* Anpassung für sehr kleine Bildschirme */
        @media (max-width: 440px) {
            .site-title {
                font-size: 16px;
                margin-bottom: 2px;
            }
        }
    </style>
</head>
<body>
    <h4 class="site-title">ShareLoc</h4>
    <div class="button-container">
        <!-- onclick-Attribute rufen die JavaScript-Funktionen auf -->
		<button class="custom-button btn-link" onclick="oeffneImages()">Images</button>
        <button class="custom-button btn-link" onclick="oeffneLink()">Show Locations</button>
		<button class="custom-button btn-link" onclick="oeffneWiki()">Wiki</button>
		<button class="custom-button btn-link" onclick="oeffneReleases()">Releases</button>
		<!-- Der Button, der das Umschalten auslöst -->
		<button id="toggle-btn" onclick="toggleContainer()">📂 Test Funktionen anzeigen</button>
    </div>
	<div id="test-container" class="button-container" style="display: none;">
		<img src="whatsapp_micha.png" alt="micha" class="container-img"
		<h4>Standort an bplaced-Datenbank senden.<br>Klicke auf den Button, um deine aktuelle GPS-Position zu ermitteln und zu speichern.</br></h4>
		<button class="custom-button btn-link" id="geoBtn">Standort senden (Test)</button>
		<div id="status">Bereit.</div>
		<p>
			<button class="custom-button btn-alert" onclick="sendeEmail()">E-Mail senden</button><br></br>
		    <button class="custom-button btn-alert" onclick="zeigeNachricht()">Pop-up zeigen</button><br></br>
			<button class="custom-button btn-color" onclick="waehleZufaelligeFarbe()">Hintergrund ändern</button>
		</p>
	</div>
	
    <script>
        // Aktion 1: Link in neuem Tab öffnen
        function oeffneLink() {
            window.open("http://almica.bplaced.net/showlocations.html", "_blank");
        }
        function oeffneWiki() {
            window.open("https://github.com/alminav/ShareLoc/wiki", "_blank");
        }
        function oeffneReleases() {
            window.open("https://github.com/alminav/ShareLoc/releases", "_blank");
        }
		function oeffneImages() {
            window.open("http://almica.bplaced.net/showImages.php", "_blank");
        }
		function sendeEmail() {
            window.open("http://almica.bplaced.net/send_email.php?datei=whatsapp_micha.png", "_blank");
        }
        // Aktion 2: Ein Pop-up-Fenster anzeigen
        function zeigeNachricht() {
            alert("Hallo! Du hast auf den zweiten Button geklickt.");
        }

        // Aktion 3: Eine zufällige Farbe für den Hintergrund generieren
        function waehleZufaelligeFarbe() {
            const farben = ["#f4f7f6", "#fad390", "#e8a7a1", "#9ae5e6", "#dff9fb", "#dcdde1"];
            // Wählt eine zufällige Farbe aus der Liste oben
            const zufaelligeFarbe = farben[Math.floor(Math.random() * farben.length)];
            // Wendet die Farbe auf den Body an
            document.body.style.backgroundColor = zufaelligeFarbe;
        }
		        document.getElementById('geoBtn').addEventListener('click', function() {
            const statusDiv = document.getElementById('status');
            const btn = this;


            statusDiv.innerText = "Ermittle Standort...";
            statusDiv.style.color = "orange";
            btn.disabled = true;

        const lat = 52.2;
        const lon = 10.3;
		const alt = 72.2;
		const temp = 23.5;
		//const url = "http://almica.bplaced.net/IMG_20261002_153336.jpg"
		const url = "http://almica.bplaced.net/uploads/compose_geo_04_10_2026_09_26_15.jpg"

        // Daten per POST an das bplaced-Skript senden
        const formData = new FormData();
        formData.append('title', 'Mein aktueller Standort');
        formData.append('latitude', lat);
        formData.append('longitude', lon);
		formData.append('altitude', alt);
		formData.append('temperature', temp);
		formData.append('image_url', url);
		statusDiv.innerText = String(lat);
		
        fetch('location.php', {
            method: 'POST',
            body: formData
        })
        .then(response => console.log(response.json()))
        .catch(error => console.error('Fehler:', error));
        });
		function toggleContainer() {
			const container = document.getElementById('test-container');
			const btn = document.getElementById('toggle-btn');
			
			// Prüfen, ob der Container gerade unsichtbar ist
			if (container.style.display === 'none') {
				container.style.display = 'block'; // Sichtbar machen
				btn.textContent = '❌ Test Funktionen schließen'; // Button-Text anpassen
			} else {
				container.style.display = 'none';  // Unsichtbar machen
				btn.textContent = '📂 Test Funktionen anzeigen';  // Button-Text zurücksetzen
			}
		}		
    </script>

</body>
</html>
