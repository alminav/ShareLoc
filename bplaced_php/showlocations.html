<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareLoc - Standorte</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 15px;
        }

        h1 { 
            font-size: 24px; 
            color: #2c3e50;
        }

        .refresh-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .refresh-btn:hover {
            background-color: #2980b9;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 15px;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .img-link {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        .img-link:hover {
            text-decoration: underline;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 30px;
            font-style: italic;
        }

        /* --- STYLING FÜR DIE BILD-VORSCHAU (MODAL) --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            background-color: #ffffff;
            color: #333;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .modal-btn.rotate-btn {
            background-color: #2ecc71;
            color: white;
        }

        .modal-btn.close-btn {
            background-color: #e74c3c;
            color: white;
        }

        .modal-content-wrapper {
            max-width: 80%;
            max-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Das Bild wird weich animiert, wenn es rotiert */
        #modalImage {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            transition: transform 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ShareLoc – Standorte</h1>
            <button class="refresh-btn" onclick="fetchLocations()">Daten aktualisieren</button>
        </header>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Device</th>
                        <th>Breitengrad Längengrad</th>
                        <th>Bild (Vorschau)</th>
                        <th>Zeitstempel</th>
                    </tr>
                </thead>
                <tbody id="locationTableBody">
                    <tr>
                        <td colspan="6" class="no-data">Lade Daten vom Server...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Das interaktive Vorschau-Fenster (Modal) -->
    <div id="imageModal" class="modal">
        <div class="modal-controls">
            <button class="modal-btn rotate-btn" onclick="rotateImage()">🔄 90° Drehen</button>
            <button class="modal-btn close-btn" onclick="closeModal()">❌ Schließen</button>
        </div>
        <div class="modal-content-wrapper">
            <img id="modalImage" src="" alt="Vorschau">
        </div>
    </div>

    <script>
        let currentRotation = 0;
		function fetchLocations() {
			fetch('get_locations.php')
				.then(response => {
					if (!response.ok) throw new Error('Netzwerk-Antwort war fehlerhaft');
					return response.json();
				})
				.then(res => {
					const tableBody = document.getElementById('locationTableBody');
					tableBody.innerHTML = ''; 

					if (res.status === 'success' && res.data && res.data.length > 0) {
						
						res.data.forEach(loc => {
							const id = loc.id;
							const title = loc.title || 'Unbenannter Ort';
							const lat = parseFloat(loc.latitude).toFixed(7);
							const lon = parseFloat(loc.longitude).toFixed(7);
							const date = loc.created_at;
							const imageUrl = loc.image_url;

							// 1. Bild-Zelle vorbereiten
							let imageCell = '<span style="color: #bbb;">—</span>';
							if (imageUrl && imageUrl.trim() !== '') {
								imageCell = `<span class="img-link" onclick="openModal('${imageUrl}')">🖼️ Bild anzeigen</span>`;
							}

							// 2. Universelle Google Maps URL erstellen
							// Öffnet am PC den Browser und am Smartphone direkt die Google Maps App
							// Wichtig: Verwenden Sie encodeURIComponent, um die Parameter sicher zu formatieren
							const coordinates = encodeURIComponent(`${lat},${lon}`);

							// Vollständige dynamische URLs generieren
							//const mapWithPinUrl = `https://google.com{$coordinates}`;
							//const googleMapsUrl = `https://google.com${coordinates}`; //`https://maps.google.com?q={lat},${lon}`;
							const googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
							// http://maps.google.com/?q=52.3,10.3

							const row = document.createElement('tr');
							row.innerHTML = `
								<td style="color: #888;">#${id}</td>
								<td><strong>${title}</strong></td>
								<!-- Die Koordinaten als direkter Google Maps Link -->
								<td>
									<a href="${googleMapsUrl}" target="_blank" style="color: #3498db; text-decoration: none; font-weight: 500;">
										📍 ${lat}, ${lon}
									</a>
								</td>
								<td>${imageCell}</td>
								<td style="color: #666;">${date}</td>
						                                <!-- Der neue Löschen-Button -->
                                <td>
                                    <button class="delete-btn" onclick="deleteLocation(${id}, '${title}')">🗑️ Löschen</button>
                                </td>
							`;
							
							tableBody.appendChild(row);
						});

					} else {
						tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Keine Standorte in der Datenbank gefunden.</td></tr>';
					}
				})
				.catch(error => {
					console.error('Fehler:', error);
					document.getElementById('locationTableBody').innerHTML = 
						`<tr><td colspan="5" class="no-data" style="color: red;">Fehler beim Laden: ${error.message}</td></tr>`;
				});
		}

        // --- NEUE LÖSCH-FUNKTION (AJAX POST) ---
        function deleteLocation(id, title) {
            if (confirm(`Möchten Sie den Eintrag "#${id} - ${title}" wirklich unwiderruflich löschen?`)) {
                const formData = new FormData();
                formData.append('id', id);

                fetch('delete_location.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Nach erfolgreichem Löschen Tabelle im Hintergrund neu laden
                        fetchLocations();
                    } else {
                        alert('Fehler beim Löschen: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Fehler:', error);
                    alert('Netzwerkfehler beim Löschvorgang.');
                });
            }
        }
		
        // --- MODAL & ROTATIONS LOGIK ---
        function openModal(url) {
            currentRotation = 0; // Rotation zurücksetzen
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImage');
            
            img.style.transform = `rotate(${currentRotation}deg)`;
            img.src = url;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function rotateImage() {
            currentRotation = (currentRotation + 90) % 360; // Erhöht um 90 Grad
            document.getElementById('modalImage').style.transform = `rotate(${currentRotation}deg)`;
        }

        // Schließen, wenn man außerhalb des Bildes in den dunklen Bereich klickt
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this || e.target.classList.contains('modal-content-wrapper')) {
                closeModal();
            }
        });

        window.onload = fetchLocations;
    </script>
</body>
</html>
